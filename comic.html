// Stable IDs so state.bubbleOverrides keys survive template edits.
BUBBLE_TEMPLATES.forEach((t, i) => { t.id = 'tpl-' + i; });

// User edits (text, size, style, position) applied on top of BUBBLE_TEMPLATES.
// Persisted alongside vertices in localStorage.
function resolveTemplate(t) {
  const o = state.bubbleOverrides && state.bubbleOverrides[t.id];
  return o ? { ...t, ...o } : t;
}
function isTemplateDeleted(t) {
  const o = state.bubbleOverrides && state.bubbleOverrides[t.id];
  return o && o.deleted;
}

// Default body font — Comic Neue. Matches the exact Silver Age Marvel
// narration lettering shown in the reference (top of screenshot5656.jpg):
// bold uppercase with italic emphasis on key words.
let currentFont = 'Comic Neue';

// Fill colour + ink colour per rect type. Used by both the drawer and the
// WYSIWYG editor overlay so what you edit looks exactly like what renders.
const TYPE_STYLE = {
  yellowbox:       { fill: '#f5e688', ink: '#000', shadow: false, radius: 0, forceUpper: true },
  orangebox:       { fill: '#ff8c1a', ink: '#000', shadow: false, radius: 0 },
  redbox:          { fill: '#e63328', ink: '#fff', shadow: false, radius: 0 },
  pinkbox:         { fill: '#ff8fb8', ink: '#000', shadow: false, radius: 0, forceUpper: true },
  yellowhighlight: { fill: '#f8e71c', ink: '#000', shadow: true,  radius: 0, alwaysItalic: true },
  blueflag:        { fill: '#4a90e2', ink: '#fff', shadow: true,  radius: 0, alwaysItalic: true },
  quotebubble:     { fill: '#ffffff', ink: '#000', shadow: false, radius: 10, autoQuote: true },
  comicspeech:     { fill: '#ffffff', ink: '#000', shadow: false, radius: 22 },
  // Shape-cropped PNGs from panels.png — bubble shape lives in the image,
  // text is overlaid via drawSvgBubbleText.
  imagebubble:     { fill: 'transparent', ink: '#000', shadow: false, radius: 0 },
};

function appendSvgBubble(parent, t) {
  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('class', 'svg-bubble');
  g.setAttribute('data-tpl-id', t.id);
  g.style.pointerEvents = 'auto';
  g.style.cursor = 'move';
  if      (t.type === 'speech')          drawSvgSpeech(g, t);
  else if (t.type === 'thought')         drawSvgThought(g, t);
  else if (t.type === 'yellowhighlight') drawSvgShadowRect(g, t, '#f8e71c');
  else if (t.type === 'blueflag')        drawSvgShadowRect(g, t, '#4a90e2');
  else if (t.type === 'quotebubble')     drawSvgRoundedRect(g, t, '#fff', 10);
  else if (t.type === 'orangebox')       drawSvgRectCallout(g, t, '#ff8c1a');
  else if (t.type === 'redbox')          drawSvgRectCallout(g, t, '#e63328');
  else if (t.type === 'pinkbox')         drawSvgRectCallout(g, t, '#ff8fb8');
  else if (t.type === 'yellowbox')       drawSvgRectCallout(g, t, '#f5e688');
  else if (t.type === 'comicspeech')     drawSvgComicSpeech(g, t);
  else if (t.type === 'imagebubble')     drawSvgImageBubble(g, t);
  // Skip in-SVG text when this template is being edited — the editor's
  // textarea sits on top and provides live WYSIWYG rendering.
  if (t.text && state.selectedTemplateId !== t.id) drawSvgBubbleText(g, t);
  // Selection halo (visible only when this template is being edited)
  if (state.selectedTemplateId === t.id) {
    const halo = document.createElementNS(SVG_NS, 'rect');
    halo.setAttribute('x', t.cx - t.rx - 6);
    halo.setAttribute('y', t.cy - t.ry - 6);
    halo.setAttribute('width',  t.rx * 2 + 12);
    halo.setAttribute('height', t.ry * 2 + 12);
    halo.setAttribute('fill', 'none');
    halo.setAttribute('stroke', '#4a90e2');
    halo.setAttribute('stroke-width', '2');
    halo.setAttribute('stroke-dasharray', '6 4');
    halo.style.pointerEvents = 'none';
    g.appendChild(halo);
  }
  // Click OR drag: if the mouse moves > 3px between down/up it's a drag,
  // else it's a click that opens the editor. This lets you reposition any
  // template bubble directly, without opening the editor first.
  g.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const startCx = t.cx, startCy = t.cy;
    let moved = false;
    function onMove(ev) {
      const stg = stagePixelSize();
      const dx = (ev.clientX - startX) * (VIEW_W / stg.w);
      const dy = (ev.clientY - startY) * (VIEW_H / stg.h);
      if (!moved && Math.hypot(dx, dy) > 3) moved = true;
      if (!moved) return;
      const cx = startCx + dx, cy = startCy + dy;
      updateOverride(t.id, { cx, cy });
      renderPanels();
      // Keep any open editor tracking the new position
      const ed = document.querySelector('.tpl-editor');
      if (ed && state.selectedTemplateId === t.id) positionEditor(ed, { cx, cy, rx: t.rx, ry: t.ry });
    }
    function onUp() {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      if (!moved) openTemplateEditor(t.id);
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
  parent.appendChild(g);
}

// Sharp rectangular callout with heavy black border (STEP badges etc).
function drawSvgRectCallout(g, t, fill) {
  const { cx, cy, rx, ry } = t;
  const bw = 2.5;
  const outer = document.createElementNS(SVG_NS, 'rect');
  outer.setAttribute('x', cx - rx - bw); outer.setAttribute('y', cy - ry - bw);
  outer.setAttribute('width', rx*2 + bw*2); outer.setAttribute('height', ry*2 + bw*2);
  outer.setAttribute('fill', '#000');
  g.appendChild(outer);
  const inner = document.createElementNS(SVG_NS, 'rect');
  inner.setAttribute('x', cx - rx); inner.setAttribute('y', cy - ry);
  inner.setAttribute('width', rx*2); inner.setAttribute('height', ry*2);
  inner.setAttribute('fill', fill);
  g.appendChild(inner);
}

// Same as drawSvgRectCallout but with a hard drop shadow — matches the
// yellow-highlight and blue-flag styles in image 2.
function drawSvgShadowRect(g, t, fill) {
  const { cx, cy, rx, ry } = t;
  const bw = 2.5;
  const off = 3.5;
  const sh = document.createElementNS(SVG_NS, 'rect');
  sh.setAttribute('x', cx - rx - bw + off); sh.setAttribute('y', cy - ry - bw + off);
  sh.setAttribute('width', rx*2 + bw*2);    sh.setAttribute('height', ry*2 + bw*2);
  sh.setAttribute('fill', 'rgba(0,0,0,0.42)');
  g.appendChild(sh);
  const outer = document.createElementNS(SVG_NS, 'rect');
  outer.setAttribute('x', cx - rx - bw); outer.setAttribute('y', cy - ry - bw);
  outer.setAttribute('width', rx*2 + bw*2); outer.setAttribute('height', ry*2 + bw*2);
  outer.setAttribute('fill', '#000');
  g.appendChild(outer);
  const inner = document.createElementNS(SVG_NS, 'rect');
  inner.setAttribute('x', cx - rx); inner.setAttribute('y', cy - ry);
  inner.setAttribute('width', rx*2); inner.setAttribute('height', ry*2);
  inner.setAttribute('fill', fill);
  g.appendChild(inner);
}

// Bubble shape supplied as a PNG cut out from panels.png (transparent
// background, black outline + white interior baked in). Text overlays on top.
function drawSvgImageBubble(g, t) {
  const { cx, cy, rx, ry, url } = t;
  if (!url) return;
  const img = document.createElementNS(SVG_NS, 'image');
  img.setAttribute('href', url);
  img.setAttribute('x', cx - rx);
  img.setAttribute('y', cy - ry);
  img.setAttribute('width',  rx * 2);
  img.setAttribute('height', ry * 2);
  img.setAttribute('preserveAspectRatio', 'none');
  img.style.pointerEvents = 'none';
  g.appendChild(img);
}

// White rounded rect with thin black border — the "check" quote style.
function drawSvgRoundedRect(g, t, fill, radius) {
  const { cx, cy, rx, ry } = t;
  const bw = 2.5;
  const outer = document.createElementNS(SVG_NS, 'rect');
  outer.setAttribute('x', cx - rx - bw); outer.setAttribute('y', cy - ry - bw);
  outer.setAttribute('width', rx*2 + bw*2); outer.setAttribute('height', ry*2 + bw*2);
  outer.setAttribute('rx', radius + bw); outer.setAttribute('ry', radius + bw);
  outer.setAttribute('fill', '#000');
  g.appendChild(outer);
  const inner = document.createElementNS(SVG_NS, 'rect');
  inner.setAttribute('x', cx - rx); inner.setAttribute('y', cy - ry);
  inner.setAttribute('width', rx*2); inner.setAttribute('height', ry*2);
  inner.setAttribute('rx', radius); inner.setAttribute('ry', radius);
  inner.setAttribute('fill', fill);
  g.appendChild(inner);
}

// Chunky rounded speech (newscreenshot.png "WIELD THE CROSSBAR I…" look).
function drawSvgComicSpeech(g, t) {
  const { cx, cy, rx, ry } = t;
  const bw = 3;
  const r = Math.min(rx, ry) * 0.4;
  const outer = document.createElementNS(SVG_NS, 'rect');
  outer.setAttribute('x', cx - rx - bw); outer.setAttribute('y', cy - ry - bw);
  outer.setAttribute('width', rx*2 + bw*2); outer.setAttribute('height', ry*2 + bw*2);
  outer.setAttribute('rx', r + bw); outer.setAttribute('ry', r + bw);
  outer.setAttribute('fill', '#000');
  g.appendChild(outer);
  const inner = document.createElementNS(SVG_NS, 'rect');
  inner.setAttribute('x', cx - rx); inner.setAttribute('y', cy - ry);
  inner.setAttribute('width', rx*2); inner.setAttribute('height', ry*2);
  inner.setAttribute('rx', r); inner.setAttribute('ry', r);
  inner.setAttribute('fill', '#fff');
  g.appendChild(inner);
}

// SVG <text> centered inside the bubble, sized to fit the interior. Splits on
// spaces into up to 3 wrapped lines so longer captions still read cleanly.
// Split a line into segments, each { text, italic }. `*word*` toggles italic.
function parseItalicSegments(line) {
  const parts = [];
  const re = /\*([^*]+)\*/g;
  let last = 0, m;
  while ((m = re.exec(line)) !== null) {
    if (m.index > last) parts.push({ text: line.slice(last, m.index), italic: false });
    parts.push({ text: m[1], italic: true });
    last = re.lastIndex;
  }
  if (last < line.length) parts.push({ text: line.slice(last), italic: false });
  return parts.length ? parts : [{ text: line, italic: false }];
}
const stripMarkers = s => s.replace(/\*/g, '');

function drawSvgBubbleText(g, t) {
  const { cx, cy, rx, ry, align = 'center' } = t;
  const spec = TYPE_STYLE[t.type] || { fill: '#fff', ink: '#000' };
  let text = t.text;
  if (spec.autoQuote && text) text = `"${text.replace(/^"|"$/g, '')}"`;
  if (spec.forceUpper && text) text = text.toUpperCase();

  const isRect = !!TYPE_STYLE[t.type];
  // Image bubbles are rasters with curved interiors; text needs more padding
  // so it lands inside the bubble's actual white area, not the corners.
  const isImage = t.type === 'imagebubble';
  const padX = isImage ? rx * 0.25 : (isRect ? rx * 0.08 : rx * 0.2);
  const padY = isImage ? ry * 0.28 : (isRect ? ry * 0.14 : ry * 0.2);
  const areaW = (rx - padX) * 2;
  const areaH = (ry - padY) * 2;

  const lines = text.includes('\n') ? text.split('\n') : wrapForBubble(text, areaW);
  const stripped = lines.map(stripMarkers);

  const perLine = areaH / lines.length;
  const longest = Math.max(3, ...stripped.map(l => l.length));
  let fontPx = Math.min(perLine * 0.82, areaW / (longest * 0.52));
  fontPx = Math.max(7, Math.min(fontPx, 36));

  const lineH = fontPx * 1.15;
  const totalH = lines.length * lineH;
  const startY = cy - totalH / 2 + fontPx * 0.85;
  const textX  = align === 'left' ? (cx - rx + padX) : cx;
  const anchor = align === 'left' ? 'start' : 'middle';
  const font = t.font || currentFont;
  const italicAll = spec.alwaysItalic;

  lines.forEach((line, i) => {
    if (!line.trim()) return;
    const txt = document.createElementNS(SVG_NS, 'text');
    txt.setAttribute('x', textX);
    txt.setAttribute('y', startY + i * lineH);
    txt.setAttribute('text-anchor', anchor);
    txt.setAttribute('font-family', `"${font}", system-ui, sans-serif`);
    txt.setAttribute('font-weight', '700');
    txt.setAttribute('font-size', fontPx);
    txt.setAttribute('fill', spec.ink);
    txt.setAttribute('class', 'bubble-text');
    if (italicAll) txt.setAttribute('font-style', 'italic');
    parseItalicSegments(line).forEach(seg => {
      const tspan = document.createElementNS(SVG_NS, 'tspan');
      if (seg.italic && !italicAll) tspan.setAttribute('font-style', 'italic');
      tspan.textContent = seg.text;
      txt.appendChild(tspan);
    });
    g.appendChild(txt);
  });
}

function wrapForBubble(text, maxChars) {
  const perLineChars = Math.max(4, Math.floor(maxChars / 5.2));
  const words = text.split(/\s+/);
  const lines = [];
  let cur = '';
  for (const w of words) {
    if (!cur.length) { cur = w; continue; }
    if ((cur + ' ' + w).length > perLineChars) { lines.push(cur); cur = w; }
    else cur += ' ' + w;
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 4);
}

// Speech: black-outlined white ellipse + short pointed tail off one edge.
function drawSvgSpeech(g, t) {
  const { cx, cy, rx, ry } = t;
  // Ellipse body
  const e = document.createElementNS(SVG_NS, 'ellipse');
  e.setAttribute('cx', cx); e.setAttribute('cy', cy);
  e.setAttribute('rx', rx); e.setAttribute('ry', ry);
  e.setAttribute('fill', '#fff');
  e.setAttribute('stroke', BORDER);
  e.setAttribute('stroke-width', BUBBLE_STROKE_W);
  g.appendChild(e);
  // Tail — small triangle attached to the side/bottom of the ellipse.
  const tailLen = 12;
  let base1, base2, tip;
  if (t.tail === 'r') {
    base1 = { x: cx + rx * 0.6, y: cy + ry * 0.7 };
    base2 = { x: cx + rx * 0.9, y: cy + ry * 0.2 };
    tip   = { x: cx + rx + tailLen, y: cy + ry * 0.5 };
  } else if (t.tail === 'b') {
    base1 = { x: cx - rx * 0.15, y: cy + ry * 0.85 };
    base2 = { x: cx + rx * 0.15, y: cy + ry * 0.85 };
    tip   = { x: cx - rx * 0.05, y: cy + ry + tailLen };
  } else {
    base1 = { x: cx - rx * 0.6, y: cy + ry * 0.7 };
    base2 = { x: cx - rx * 0.2, y: cy + ry * 0.9 };
    tip   = { x: cx - rx * 0.75, y: cy + ry + tailLen };
  }
  const tailPoly = document.createElementNS(SVG_NS, 'polygon');
  tailPoly.setAttribute('points', `${base1.x},${base1.y} ${tip.x},${tip.y} ${base2.x},${base2.y}`);
  tailPoly.setAttribute('fill', '#fff');
  tailPoly.setAttribute('stroke', BORDER);
  tailPoly.setAttribute('stroke-width', BUBBLE_STROKE_W);
  tailPoly.setAttribute('stroke-linejoin', 'round');
  g.appendChild(tailPoly);
  // A short white line covers the seam between ellipse and tail base.
  const seam = document.createElementNS(SVG_NS, 'line');
  seam.setAttribute('x1', base1.x); seam.setAttribute('y1', base1.y);
  seam.setAttribute('x2', base2.x); seam.setAttribute('y2', base2.y);
  seam.setAttribute('stroke', '#fff');
  seam.setAttribute('stroke-width', BUBBLE_STROKE_W + 1);
  g.appendChild(seam);
}

// Thought: ellipse ringed by scallops + 3 cascading tail circles. Two-pass
// (black outer then white inner) so scallop edges merge cleanly.
function drawSvgThought(g, t) {
  const { cx, cy, rx, ry } = t;
  const bw = 1.6;
  const puffs = 10;
  const puffR = Math.min(rx, ry) * 0.32;
  const tailX = cx - rx * 0.42;

  // OUTLINE (black, outset)
  const oute = document.createElementNS(SVG_NS, 'ellipse');
  oute.setAttribute('cx', cx); oute.setAttribute('cy', cy);
  oute.setAttribute('rx', rx + bw); oute.setAttribute('ry', ry + bw);
  oute.setAttribute('fill', BORDER);
  g.appendChild(oute);
  for (let i = 0; i < puffs; i++) {
    const a = (i / puffs) * Math.PI * 2 - Math.PI/2;
    const px = cx + Math.cos(a) * rx;
    const py = cy + Math.sin(a) * ry;
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', px); c.setAttribute('cy', py);
    c.setAttribute('r', puffR + bw);
    c.setAttribute('fill', BORDER);
    g.appendChild(c);
  }
  [[tailX,           cy + ry + 12, 10],
   [tailX - 14,      cy + ry + 24, 6],
   [tailX - 24,      cy + ry + 33, 3]].forEach(([x, y, r]) => {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y);
    c.setAttribute('r', r + bw); c.setAttribute('fill', BORDER);
    g.appendChild(c);
  });

  // FILL (white, inset — hides seams)
  const inne = document.createElementNS(SVG_NS, 'ellipse');
  inne.setAttribute('cx', cx); inne.setAttribute('cy', cy);
  inne.setAttribute('rx', rx - bw); inne.setAttribute('ry', ry - bw);
  inne.setAttribute('fill', '#fff');
  g.appendChild(inne);
  for (let i = 0; i < puffs; i++) {
    const a = (i / puffs) * Math.PI * 2 - Math.PI/2;
    const px = cx + Math.cos(a) * rx;
    const py = cy + Math.sin(a) * ry;
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', px); c.setAttribute('cy', py);
    c.setAttribute('r', puffR - bw); c.setAttribute('fill', '#fff');
    g.appendChild(c);
  }
  // Central seam-hider (slightly smaller than the outer ellipse)
  const hide = document.createElementNS(SVG_NS, 'ellipse');
  hide.setAttribute('cx', cx); hide.setAttribute('cy', cy);
  hide.setAttribute('rx', rx * 0.96); hide.setAttribute('ry', ry * 0.96);
  hide.setAttribute('fill', '#fff');
  g.appendChild(hide);
  [[tailX,           cy + ry + 12, 7],
   [tailX - 14,      cy + ry + 24, 3],
   [tailX - 24,      cy + ry + 33, 1]].forEach(([x, y, r]) => {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y);
    c.setAttribute('r', r); c.setAttribute('fill', '#fff');
    g.appendChild(c);
  });
}

// =====================================================================
//  RENDER — HTML vertex handles
// =====================================================================

const handleLayer = document.getElementById('handle-layer');

function renderHandles() {
  handleLayer.innerHTML = '';
  state.vertices.forEach((v, id) => {
    // Skip pinned corners AND left/right edge verts (no horizontal freedom).
    if (v.edge && (v.edge.startsWith('corner') || v.edge === 'left' || v.edge === 'right')) return;
    const h = document.createElement('div');
    h.className = 'vhandle';
    h.style.left = (v.x / VIEW_W * 100) + '%';
    h.style.top  = (v.y / VIEW_H * 100) + '%';
    h.dataset.vid = id;
    h.addEventListener('mousedown', (e) => startVertexDrag(e, id, h));
    handleLayer.appendChild(h);
  });
}

function updateHandlePositions() {
  handleLayer.querySelectorAll('.vhandle').forEach(h => {
    const v = state.vertices[+h.dataset.vid];
    h.style.left = (v.x / VIEW_W * 100) + '%';
    h.style.top  = (v.y / VIEW_H * 100) + '%';
  });
}

// =====================================================================
//  VERTEX DRAG — shared-vertex propagation via updatePanelGeometry
// =====================================================================

function stagePixelSize() {
  const rect = document.getElementById('stage').getBoundingClientRect();
  return { w: rect.width, h: rect.height };
}

function startVertexDrag(e, vid, handleEl) {
  e.preventDefault();
  e.stopPropagation();
  // Left/right edge verts have no horizontal freedom; skip.
  const v = state.vertices[vid];
  if (v.edge === 'left' || v.edge === 'right') return;
  const origX = v.x;
  const startClientX = e.clientX;
  handleEl.classList.add('dragging');
  document.body.style.cursor = 'ew-resize';

  // Same-row neighbours only (X clamp)
  const row = VERTEX_ROW[vid];
  const sameRow = state.vertices
    .map((vv, i) => ({ i, vv, row: VERTEX_ROW[i] }))
    .filter(o => o.row === row);
  const leftX  = Math.max(...sameRow.filter(o => o.vv.x < origX).map(o => o.vv.x), -Infinity);
  const rightX = Math.min(...sameRow.filter(o => o.vv.x > origX).map(o => o.vv.x),  Infinity);
  const CLAMP_PAD = 20;

  function onMove(ev) {
    const stg = stagePixelSize();
    const dxWorld = (ev.clientX - startClientX) * (VIEW_W / stg.w);
    let nx = origX + dxWorld;
    nx = Math.max(leftX + CLAMP_PAD, Math.min(rightX - CLAMP_PAD, nx));
    v.x = nx;    // Y locked — vertices only slide horizontally.
    updatePanelGeometry();
    updateHandlePositions();
  }
  function onUp() {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    handleEl.classList.remove('dragging');
    document.body.style.cursor = '';
    saveState();
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

// =====================================================================
//  PANEL SELECTION + IMAGE PASTE
// =====================================================================

function selectPanel(panelId) {
  state.selectedPanelId = panelId;
  svg.querySelectorAll('polygon[data-panel-stroke]').forEach(n => {
    n.setAttribute('stroke', n.dataset.panelStroke === panelId ? '#4a90e2' : 'rgba(0,0,0,0)');
  });
  if (state.selectedBubbleId !== null) selectBubble(null);
}

function deselectAll() {
  state.selectedPanelId = null;
  svg.querySelectorAll('polygon[data-panel-stroke]').forEach(n => {
    n.setAttribute('stroke', 'rgba(0,0,0,0)');
  });
  if (state.selectedBubbleId !== null) selectBubble(null);
}

window.addEventListener('paste', (e) => {
  const target = e.target;
  const isTextField = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA');
  if (isTextField) return;

  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  let imageBlob = null;
  for (const it of items) {
    if (it.type && it.type.startsWith('image/')) {
      imageBlob = it.getAsFile();
      if (imageBlob) break;
    }
  }
  if (!imageBlob) return;
  e.preventDefault();
  const reader = new FileReader();
  reader.onload = () => {
    // Panel selected → set as that panel's background (existing behavior).
    if (state.selectedPanelId) {
      state.panelImages[state.selectedPanelId] = { url: reader.result, scale: 1, ox: 0, oy: 0 };
      renderPanels();
      saveState();
      showToast('Image pasted — drag to move · scroll to zoom');
      return;
    }
    // Otherwise drop as a floating image bubble at the stage center.
    const probe = new Image();
    probe.onload = () => {
      const maxDim = Math.min(VIEW_W, VIEW_H) * 0.55;
      const scale = Math.min(1, maxDim / Math.max(probe.naturalWidth, probe.naturalHeight));
      const w = Math.max(60, probe.naturalWidth * scale);
      const h = Math.max(60, probe.naturalHeight * scale);
      placeBubble({
        type: 'image',
        src: reader.result,
        x: VIEW_W / 2 - w / 2,
        y: VIEW_H / 2 - h / 2,
        w, h,
        focus: true,
      });
      showToast('Image pasted — drag anywhere');
    };
    probe.src = reader.result;
  };
  reader.readAsDataURL(imageBlob);
});

// Drag-to-pan (crop-adjust) the pasted image inside a panel. Only fires if
// the user actually moves >3px, so a plain click still just selects the panel.
function startImagePan(e, panelId) {
  const startX = e.clientX, startY = e.clientY;
  const imgD = state.panelImages[panelId];
  if (!imgD) return;
  const origOx = imgD.ox || 0;
  const origOy = imgD.oy || 0;
  let moved = false;
  function onMove(ev) {
    const stg = stagePixelSize();
    const dxWorld = (ev.clientX - startX) * (VIEW_W / stg.w);
    const dyWorld = (ev.clientY - startY) * (VIEW_H / stg.h);
    if (!moved && Math.hypot(dxWorld, dyWorld) > 3) moved = true;
    if (!moved) return;
    imgD.ox = origOx + dxWorld;
    imgD.oy = origOy + dyWorld;
    renderPanels();
  }
  function onUp() {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    if (moved) saveState();
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

// Wheel over a selected panel with an image → scale the image. Border stays
// a constant stroke-width because it's on a separate polygon layer above.
document.getElementById('stage').addEventListener('wheel', (e) => {
  if (!state.selectedPanelId) return;
  const imgData = state.panelImages[state.selectedPanelId];
  if (!imgData) return;
  e.preventDefault();
  // Trackpad pinch on macOS fires wheel with ctrlKey=true. Handle both.
  const factor = Math.exp(-e.deltaY * 0.006);
  imgData.scale = Math.max(0.3, Math.min(15, (imgData.scale || 1) * factor));
  renderPanels();
  saveState();
}, { passive: false });

// =====================================================================
//  DOUBLE-CLICK CREATOR (ported from index.html openCreator + materializeRing)
// =====================================================================
//
// Double-click anywhere on the stage → text input appears at cursor.
// Type + Enter → materialises a ring of bubble styles around it (all sharing
// the typed text). Left/right arrows swap between TEXT and IMPACT banks.

const STYLE_BANKS = [
  /* TEXT   */ ['caption', 'silver',    'narrator',  'dialog', 'double',      'speech',  'thought', 'silvercloud'],
  /* IMPACT */ ['pop',     'silver',    'chromatic', 'glitch', 'silvercloud', 'display', 'kirby',   'soundfx'   ],
];
let currentBank = 0;
let nextStackId = 1;
const stageEl = document.getElementById('stage');

// Double-click → vertical stack of every style. As soon as the user drags
// one bubble out of its stack slot, that bubble is "claimed" (stackId cleared)
// and stays. The next dblclick sweeps away any UNCLAIMED bubbles from
// previous stacks before spawning a new one.
function openCreator(wx, wy) {
  purgeUnclaimedStacks();

  const el = document.createElement('div');
  el.className = 'creator';
  el.style.left = wx + 'px';
  el.style.top  = wy + 'px';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'text';
  input.placeholder = 'TYPE...';
  el.appendChild(input);
  bubbleLayer.appendChild(el);
  const creator = { el, input, items: [], x: wx, y: wy, stackId: nextStackId++ };

  input.addEventListener('input', () => {
    if (!creator.items.length) return;
    const text = input.value.trim() || 'HELLO';
    creator.items.forEach(b => {
      b.text = text;
      if (b.textarea) b.textarea.value = text;
    });
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const text = input.value.trim();
      currentBank = text.length <= 12 ? 1 : 0;
      materializeStack(creator);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      el.remove();
    } else if (!creator.items.length && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      currentBank = (currentBank + (e.key === 'ArrowRight' ? 1 : -1) + STYLE_BANKS.length) % STYLE_BANKS.length;
      showToast('Bank ' + (currentBank + 1) + '/' + STYLE_BANKS.length);
    }
  });
  setTimeout(() => input.focus(), 0);
  return creator;
}

// Vertical column of options (was a ring). Fits inside the stage-wrap height;
// centre column re-anchored around click if it would overflow top or bottom.
function materializeStack(creator) {
  if (creator.items.length) return;
  const text = creator.input.value.trim() || 'HELLO';
  const styleKeys = STYLE_BANKS[currentBank];
  const N = styleKeys.length;
  // Compact preview size — small enough that 8 stack vertically without overflow.
  const SCALE = 0.35;
  const GAP   = 8;
  const sizes = styleKeys.map(k => ({
    w: STYLES[k].size.w * SCALE,
    h: STYLES[k].size.h * SCALE,
  }));
  const totalH = sizes.reduce((s, x) => s + x.h, 0) + GAP * (N - 1);
  // Anchor so the stack fits inside the viewBox regardless of where user clicked.
  let topY = creator.y - totalH / 2;
  topY = Math.max(4, Math.min(VIEW_H - totalH - 4, topY));
  const xCol = creator.x + 60;   // stack sits to the right of the input caret
  let y = topY;
  styleKeys.forEach((key, i) => {
    const s = sizes[i];
    const x = xCol - s.w / 2;
    placeBubble({ style: key, x, y, w: s.w, h: s.h, text, focus: false });
    const b = state.bubbles[state.bubbles.length - 1];
    b.stackId = creator.stackId;
    creator.items.push(b);
    y += s.h + GAP;
  });
  creator.input.style.opacity = '0.35';
}

// Remove every bubble still tagged with a stackId — they were shown as options
// but never dragged out of the stack, so the user didn't want them.
function purgeUnclaimedStacks() {
  const orphans = state.bubbles.filter(b => b.stackId != null);
  orphans.forEach(b => deleteBubble(b.id));
}

// Double-click ANYWHERE (except on an existing bubble / editor / sidebar)
// opens the creator. Works over the gutter or even the dark background
// outside the stage — the click still maps cleanly into viewBox coords.
document.getElementById('app').addEventListener('dblclick', (e) => {
  if (e.target.closest('.bubble')     ||    // user-placed HTML bubbles
      e.target.closest('.svg-bubble') ||    // pre-placed SVG bubbles
      e.target.closest('.creator')    ||
      e.target.closest('.tpl-editor') ||
      e.target.closest('#font-sidebar')) return;
  const rect = stageEl.getBoundingClientRect();
  const wx = (e.clientX - rect.left) * (VIEW_W / rect.width);
  const wy = (e.clientY - rect.top)  * (VIEW_H / rect.height);
  openCreator(wx, wy);
});

// =====================================================================
//  PLACED BUBBLES — canvas shape + editable <textarea> for text
// =====================================================================

const bubbleLayer = document.getElementById('bubble-layer');

// Two call shapes:
//   placeBubble('speech', wx, wy)                  ← drag-drop from palette (centers on cursor)
//   placeBubble({style, x, y, w, h, text, focus}) ← programmatic (top-left origin, exact size)
//
// For image bubbles pass { type: 'image', src, x, y, w, h }.
function placeBubble(styleKeyOrOpts, wx, wy) {
  let bubble;
  if (typeof styleKeyOrOpts === 'string') {
    const style = STYLES[styleKeyOrOpts];
    const w = style.size.w * 0.7;
    const h = style.size.h * 0.7;
    bubble = {
      id: state.nextBubbleId++,
      type: 'style',
      styleKey: styleKeyOrOpts,
      x: wx - w/2, y: wy - h/2,
      w, h,
      text: '',
      fillIndex: Math.max(0, COLORS.indexOf(style.fill)),
      fontIndex: Math.max(0, FONTS.indexOf(style.font)),
      _focus: true,
    };
  } else {
    const o = styleKeyOrOpts;
    if (o.type === 'image') {
      bubble = {
        id: state.nextBubbleId++,
        type: 'image',
        src: o.src,
        x: o.x, y: o.y, w: o.w, h: o.h,
        _focus: !!o.focus,
      };
    } else {
      const style = STYLES[o.style];
      bubble = {
        id: state.nextBubbleId++,
        type: 'style',
        styleKey: o.style,
        x: o.x, y: o.y, w: o.w, h: o.h,
        text: o.text || '',
        fillIndex: o.fillIndex != null ? o.fillIndex : Math.max(0, COLORS.indexOf(style.fill)),
        fontIndex: o.fontIndex != null ? o.fontIndex : Math.max(0, FONTS.indexOf(style.font)),
        fontScale: o.fontScale || 1,
        noShape: !!o.noShape,
        _focus: !!o.focus,
      };
    }
  }
  state.bubbles.push(bubble);
  createBubbleEl(bubble);
  if (bubble._focus) selectBubble(bubble.id);
  saveState();
}

function createBubbleEl(bubble) {
  const el = document.createElement('div');
  el.className = 'bubble' + (bubble.noShape ? ' no-shape' : '') + (bubble.type === 'image' ? ' image' : '');
  el.dataset.bid = bubble.id;
  positionBubbleEl(el, bubble);

  let canvas = null;
  let ta = null;
  let img = null;

  if (bubble.type === 'image') {
    img = document.createElement('img');
    img.src = bubble.src;
    img.draggable = false;
    el.appendChild(img);
  } else {
    canvas = bubble.noShape ? null : document.createElement('canvas');
    if (canvas) el.appendChild(canvas);

    ta = document.createElement('textarea');
    ta.className = 'btext';
    ta.placeholder = 'Type…';
    ta.rows = 1;
    ta.value = bubble.text;
    el.appendChild(ta);
  }

  // 8-handle resize
  ['nw','ne','sw','se','n','s','e','w'].forEach(dir => {
    const h = document.createElement('div');
    h.className = 'bhandle ' + dir;
    h.addEventListener('mousedown', (e) => startBubbleResize(e, bubble, dir, el));
    el.appendChild(h);
  });

  el.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('bhandle')) return;
    // Stack bubbles: always drag (user is picking from the stack).
    if (bubble.stackId != null) {
      e.preventDefault();
      e.stopPropagation();
      selectBubble(bubble.id);
      startBubbleDrag(e, bubble, el);
      return;
    }
    // Claimed bubbles: click on textarea = edit, click on body = drag.
    if (ta && e.target === ta) return;
    e.stopPropagation();
    selectBubble(bubble.id);
    startBubbleDrag(e, bubble, el);
  });

  if (ta) {
    ta.addEventListener('input', () => {
      bubble.text = ta.value;
      redrawBubble(bubble, canvas);
      positionBubbleText(bubble, ta);
      saveState();
    });
    ta.addEventListener('focus', () => selectBubble(bubble.id));
  }

  bubble.el = el;
  bubble.canvas = canvas;
  bubble.textarea = ta;
  bubble.img = img;

  bubbleLayer.appendChild(el);
  if (canvas) redrawBubble(bubble, canvas);
  if (ta) positionBubbleText(bubble, ta);
  if (bubble._focus && ta) setTimeout(() => ta.focus(), 0);
}

// Bubble lives inside #stage-wrap (which CSS-transforms the whole stage).
// So bubble positions are in the 800×600 pre-transform coord space —
// no additional scaling needed here.
function positionBubbleEl(el, bubble) {
  el.style.left   = bubble.x + 'px';
  el.style.top    = bubble.y + 'px';
  el.style.width  = bubble.w + 'px';
  el.style.height = bubble.h + 'px';
}

// mode:
//   'grow'     (default) — text overflow grows bubble.h. Used while typing.
//   'showText'           — text overflow grows textarea only (bubble stays).
//                          Used for Ctrl/Cmd +/- so the user can pump the font
//                          size up without the bubble jumping around.
//   'clip'               — no growth at all. Text clips to bubble box.
//                          Used during manual resize so the user can shrink freely.
function positionBubbleText(bubble, ta, mode = 'grow') {
  const style = STYLES[bubble.styleKey];
  const marg = TEXT_MARGIN[bubble.styleKey] || { mx: 40, my: 30 };
  let textW, textH;
  if (bubble.noShape) {
    textW = bubble.w; textH = bubble.h;
  } else {
    textW = Math.max(1, bubble.w - marg.mx * 2);
    textH = Math.max(1, bubble.h - marg.my * 2);
  }

  const baseSize = bubble.noShape
    ? Math.max(9, Math.min(textH * 0.55, 16))
    : Math.max(12, Math.min(Math.min(bubble.w, bubble.h), Math.min(style.size.w, style.size.h)) * 0.14);
  const fontSize = baseSize * (bubble.fontScale || 1);

  ta.style.fontFamily = `"${style.font}", cursive`;
  ta.style.fontSize = fontSize + 'px';
  ta.style.textTransform = style.upper ? 'uppercase' : 'none';
  ta.style.fontStyle = style.italic ? 'italic' : 'normal';
  const fill = COLORS[bubble.fillIndex] || style.fill;
  ta.style.color = isDark(fill) ? '#fff' : '#000';
  ta.style.width = textW + 'px';

  if (mode !== 'clip') {
    // Measure required height at the current font size.
    ta.style.height = 'auto';
    const needed = ta.scrollHeight;
    if (needed > textH + 1) {
      if (mode === 'grow') {
        bubble.h += (needed - textH);
        textH = needed;
        positionBubbleEl(bubble.el, bubble);
        if (bubble.canvas) redrawBubble(bubble, bubble.canvas);
      } else {
        // showText: let the textarea extend past the bubble box; the bubble
        // shape doesn't move, but the text stays visible so nothing disappears.
        textH = needed;
      }
    }
  }

  ta.style.left   = ((bubble.w - textW) / 2) + 'px';
  ta.style.top    = ((bubble.h - textH) / 2) + 'px';
  ta.style.height = textH + 'px';
}

function redrawBubble(bubble, canvas) {
  if (!canvas) return;
  setupCanvas(canvas, bubble.w, bubble.h);
  drawStyle(
    canvas.getContext('2d'),
    bubble.styleKey, bubble.w, bubble.h,
    '',
    COLORS[bubble.fillIndex],
    FONTS[bubble.fontIndex]
  );
}

function selectBubble(id) {
  if (state.selectedBubbleId !== null) {
    const prev = state.bubbles.find(b => b.id === state.selectedBubbleId);
    if (prev && prev.el) prev.el.classList.remove('selected');
  }
  state.selectedBubbleId = id;
  if (id !== null) {
    const b = state.bubbles.find(bb => bb.id === id);
    if (b && b.el) b.el.classList.add('selected');
    // Deselect panel
    if (state.selectedPanelId) {
      state.selectedPanelId = null;
      svg.querySelectorAll('polygon[data-panel-stroke]').forEach(n => {
        n.setAttribute('stroke-width', '3');
      });
    }
  }
}

function deleteBubble(id) {
  const idx = state.bubbles.findIndex(b => b.id === id);
  if (idx < 0) return;
  const b = state.bubbles[idx];
  if (b.el) b.el.remove();
  state.bubbles.splice(idx, 1);
  if (state.selectedBubbleId === id) state.selectedBubbleId = null;
  saveState();
}

function startBubbleDrag(e, bubble, el) {
  const startX = e.clientX, startY = e.clientY;
  const origX = bubble.x, origY = bubble.y;
  let moved = false;
  function onMove(ev) {
    const stg = stagePixelSize();
    const dxWorld = (ev.clientX - startX) * (VIEW_W / stg.w);
    const dyWorld = (ev.clientY - startY) * (VIEW_H / stg.h);
    if (!moved && Math.hypot(dxWorld, dyWorld) > 3) moved = true;
    bubble.x = origX + dxWorld;
    bubble.y = origY + dyWorld;
    positionBubbleEl(el, bubble);
  }
  function onUp() {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    // Claim the bubble — dragging out of stack means "I want this one".
    if (moved && bubble.stackId != null) bubble.stackId = null;
    saveState();
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

function startBubbleResize(e, bubble, dir, el) {
  e.stopPropagation();
  e.preventDefault();
  selectBubble(bubble.id);
  const startX = e.clientX, startY = e.clientY;
  const origX = bubble.x, origY = bubble.y, origW = bubble.w, origH = bubble.h;
  const MIN = 1;
  function onMove(ev) {
    const stg = stagePixelSize();
    const dx = (ev.clientX - startX) * (VIEW_W / stg.w);
    const dy = (ev.clientY - startY) * (VIEW_H / stg.h);
    let x = origX, y = origY, w = origW, h = origH;
    if (dir.includes('e')) w = Math.max(MIN, origW + dx);
    if (dir.includes('s')) h = Math.max(MIN, origH + dy);
    if (dir.includes('w')) { w = Math.max(MIN, origW - dx); x = origX + (origW - w); }
    if (dir.includes('n')) { h = Math.max(MIN, origH - dy); y = origY + (origH - h); }
    bubble.x = x; bubble.y = y; bubble.w = w; bubble.h = h;
    positionBubbleEl(el, bubble);
    if (bubble.canvas) redrawBubble(bubble, bubble.canvas);
    // 'clip' during manual resize so the user can shrink freely even if
    // the text would otherwise force it larger.
    if (bubble.textarea) positionBubbleText(bubble, bubble.textarea, 'clip');
  }
  function onUp() {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    saveState();
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

// Cycle a template through the rectangle style types.
function cycleTemplateStyle(id, dir) {
  const cur = resolveTemplate(BUBBLE_TEMPLATES.find(t => t.id === id));
  const idx = Math.max(0, RECT_TYPES.indexOf(cur.type));
  const next = RECT_TYPES[(idx + dir + RECT_TYPES.length) % RECT_TYPES.length];
  updateOverride(id, { type: next });
  renderPanels();
  showToast('style: ' + next);
}
// Cycle a template's font (per-bubble override).
function cycleTemplateFont(id, dir) {
  const cur = resolveTemplate(BUBBLE_TEMPLATES.find(t => t.id === id));
  const curFont = cur.font || currentFont;
  const idx = Math.max(0, FONTS.indexOf(curFont));
  const next = FONTS[(idx + dir + FONTS.length) % FONTS.length];
  updateOverride(id, { font: next });
  renderPanels();
  // Reflect in editor textarea
  const ta = document.querySelector('.tpl-editor textarea');
  if (ta) ta.style.fontFamily = `"${next}", system-ui, sans-serif`;
  showToast('font: ' + next);
}

document.addEventListener('keydown', (e) => {
  const t = document.activeElement;
  const inField = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');

  // Ctrl/Cmd + = / + / - : while typing in a bubble, resize the font ONLY.
  // The bubble shape / background stays exactly where it is. Text is allowed
  // to extend past the bubble box so nothing disappears.
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    const isPlus  = e.key === '+' || e.key === '=';
    const isMinus = e.key === '-' || e.key === '_';
    if (isPlus || isMinus) {
      if (t && t.tagName === 'TEXTAREA' && t.classList.contains('btext')) {
        const bubbleEl = t.closest('.bubble');
        const bid = bubbleEl && Number(bubbleEl.dataset.bid);
        const bubble = bid != null && state.bubbles.find(b => b.id === bid);
        if (bubble && bubble.type !== 'image') {
          e.preventDefault();
          const step = isPlus ? 1.15 : 1 / 1.15;
          bubble.fontScale = Math.max(0.3, Math.min(6, (bubble.fontScale || 1) * step));
          positionBubbleText(bubble, bubble.textarea, 'showText');
          saveState();
          return;
        }
      }
    }
  }

  if (e.key === 'Escape') {
    if (inField) t.blur();
    document.querySelectorAll('.creator').forEach(c => c.remove());
    closeTemplateEditor();
    deselectAll();
    return;
  }
  // Template shortcuts — active only when a template is selected AND focus
  // is NOT in a text field (so arrow keys still navigate typed text).
  if (state.selectedTemplateId) {
    if (e.key === 'Tab' && e.shiftKey) {
      e.preventDefault();
      cycleTemplateStyle(state.selectedTemplateId, -1);
      return;
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      cycleTemplateStyle(state.selectedTemplateId, +1);
      return;
    }
    if (!inField && (e.key === 'ArrowLeft' || e.key === 'ArrowUp')) {
      e.preventDefault();
      cycleTemplateFont(state.selectedTemplateId, -1);
      return;
    }
    if (!inField && (e.key === 'ArrowRight' || e.key === 'ArrowDown')) {
      e.preventDefault();
      cycleTemplateFont(state.selectedTemplateId, +1);
      return;
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && !inField) {
      e.preventDefault();
      updateOverride(state.selectedTemplateId, { deleted: true });
      closeTemplateEditor();
      return;
    }
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedBubbleId !== null && !inField) {
    e.preventDefault();
    deleteBubble(state.selectedBubbleId);
  }
});

// =====================================================================
//  STAGE FIT-TO-VIEWPORT — scale 800x600 to available centre column
// =====================================================================

const stageWrap = document.getElementById('stage-wrap');
const centerCol = document.getElementById('center');

function fitStage() {
  const rect = centerCol.getBoundingClientRect();
  const pad = 40;
  const availW = rect.width - pad * 2;
  const availH = rect.height - pad * 2;
  const scale = Math.min(availW / VIEW_W, availH / VIEW_H, 1.5);
  stageWrap.style.transform = `scale(${scale})`;
  // After scale change, bubbles need repositioning because their
  // pixel positions are based on the pre-transform stage size.
  // Since the transform applies to the whole wrap, everything inside
  // stays in the same coord space — no reposition needed. ✓
}
new ResizeObserver(fitStage).observe(centerCol);

function renderStyleChips() {
  const chips = document.getElementById('style-chips');
  if (!chips) return;
  chips.innerHTML = '';
  STYLE_ORDER.forEach(key => {
    if (!STYLES[key] || !DRAWERS[key]) return;
    const chip = document.createElement('div');
    chip.className = 'style-chip';

    const preview = document.createElement('canvas');
    chip.appendChild(preview);

      e.stopPropagation();
      spawnStyleBubbleAtStageCenter(key);
    });

    chips.appendChild(chip);
    requestAnimationFrame(() => renderStyleChipPreview(preview, key));
  });

function renderStyleChipPreview(canvas, styleKey) {
  const rect = canvas.getBoundingClientRect();
  const cw = Math.max(60, Math.floor(rect.width));
  const ch = Math.max(40, Math.floor(rect.height));
  canvas.width = Math.round(cw * DPR);
  canvas.height = Math.round(ch * DPR);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(DPR, DPR);
  const style = STYLES[styleKey];
  drawStyle(
    ctx, styleKey, cw, ch,
    STYLE_PREVIEW_TEXT[styleKey] || 'AA',
    style.fill, style.font
  );
}

// Drop a style bubble at the center of the stage (viewBox coords).
function spawnStyleBubbleAtStageCenter(styleKey) {
  const style = STYLES[styleKey];
  const w = style.size.w * 0.7;
  const h = style.size.h * 0.7;
  placeBubble({
    style: styleKey,
    x: VIEW_W / 2 - w / 2,
    y: VIEW_H / 2 - h / 2,
    w, h,
    text: '',
    focus: true,
  });
}

function setFont(f) {
  currentFont = f;
  document.querySelectorAll('#font-sidebar .fs-item').forEach(el => {
    el.classList.toggle('active', el.dataset.font === f);
  });
  svg.querySelectorAll('text.bubble-text').forEach(t => {
    t.setAttribute('font-family', `"${f}", "Comic Neue", cursive`);
  });
  state.bubbles.forEach(b => {
    b.fontIndex = FONTS.indexOf(f);
    if (b.textarea) b.textarea.style.fontFamily = `"${f}", cursive`;
    if (b.canvas)   redrawBubble(b, b.canvas);
  });
  saveState();
}

// =====================================================================
//  PERSISTENCE — localStorage auto-save/restore
// =====================================================================
//
// Everything that can change lives here: mesh vertex positions, pasted
// panel images (as base64 data URLs + scale), user-added bubbles from the
// double-click ring, and the chosen font. Fires on every mutation.
// Storage is per-origin (http://localhost:8790); reloading, closing/opening
// the browser, or restarting the machine all preserve it. Clearing browser
// data OR switching port will lose it. Cap ~5 MB.

const STORAGE_KEY = 'comic-project-v1';
let saveTimer;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      const payload = {
        v: state.vertices,
        pi: state.panelImages,
        bo: state.bubbleOverrides,
        ub: state.bubbles.filter(b => b.stackId == null).map(b => ({
          type: b.type || 'style',
          styleKey: b.styleKey, x: b.x, y: b.y, w: b.w, h: b.h,
          text: b.text, fillIndex: b.fillIndex, fontIndex: b.fontIndex,
          fontScale: b.fontScale,
          noShape: b.noShape,
          src: b.src,
        })),
        f: currentFont,
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (e) {
      console.warn('save failed', e);
    }
  }, 150);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

// Save current project to a downloadable JSON file. User commits it to the
// repo root as `project.json`; on next load, it's fetched automatically and
// overrides localStorage — so state travels across machines / deployments.
function serializeProject() {
  return {
    v: state.vertices,
    pi: state.panelImages,
    bo: state.bubbleOverrides,
    ub: state.bubbles.filter(b => b.stackId == null).map(b => ({
      styleKey: b.styleKey, x: b.x, y: b.y, w: b.w, h: b.h,
      text: b.text, fillIndex: b.fillIndex, fontIndex: b.fontIndex,
      noShape: b.noShape,
    })),
    f: currentFont,
    savedAt: new Date().toISOString(),
  };
}

function downloadProject() {
  const payload = JSON.stringify(serializeProject(), null, 2);
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'project.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Downloaded project.json — commit it to your repo');
}

function loadProjectFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const saved = JSON.parse(reader.result);
      applyLoadedState(saved);
      showToast('Loaded project.json');
    } catch (e) { showToast('Bad JSON: ' + e.message); }
  };
  reader.readAsText(file);
}

function applyLoadedState(saved) {
  if (!saved) return;
  if (saved.v)  state.vertices = saved.v;
  if (saved.pi) state.panelImages = saved.pi;
  if (saved.bo) state.bubbleOverrides = saved.bo;
  if (saved.f)  currentFont = saved.f;
  // Wipe user-added bubbles then re-place from payload.
  state.bubbles.forEach(b => b.el && b.el.remove());
  state.bubbles = [];
  renderPanels();
  renderHandles();
  if (saved.ub) {
    saved.ub.forEach(b => {
      if (b.type === 'image') {
        placeBubble({ type: 'image', src: b.src, x: b.x, y: b.y, w: b.w, h: b.h, focus: false });
      } else {
        placeBubble({ ...b, style: b.styleKey, focus: false });
      }
    });
  }
  saveState();
}

// Try to fetch project.json shipped with the site (from git repo / deployment).
// Falls back to localStorage if not found or fetch fails.
async function tryFetchProjectJson() {
  try {
    const res = await fetch('comic.json', { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { return null; }
}

// Wipe all text (template overrides + user-added bubbles), keep pasted images
// and the mesh geometry so the layout + illustrations survive.
function resetTextOnly() {
  if (!confirm('Wipe all text? Pasted images and layout will be kept.')) return;
  state.bubbleOverrides = {};
  // Keep image bubbles; only remove style/text bubbles.
  const keepers = state.bubbles.filter(b => b.type === 'image');
  state.bubbles.filter(b => b.type !== 'image').forEach(b => b.el && b.el.remove());
  state.bubbles = keepers;
  state.selectedBubbleId = null;
  state.selectedTemplateId = null;
  closeTemplateEditor();
  renderPanels();
  saveState();
  showToast('Text reset — images kept');
}

// =====================================================================
//  EDITABLE SVG BUBBLE — overlay popup with textarea + style + resize
// =====================================================================

const RECT_TYPES  = ['yellowbox', 'orangebox', 'redbox', 'pinkbox', 'yellowhighlight', 'blueflag', 'quotebubble', 'comicspeech'];
const RECT_LABELS = {
  yellowbox: 'NARR',   orangebox: 'ORG',  redbox: 'RED',
  yellowhighlight: 'HL', blueflag: 'BLUE', quotebubble: 'QUOTE',
  comicspeech: 'BUB',
};

function positionEditor(el, cur) {
  el.style.left   = (cur.cx - cur.rx) + 'px';
  el.style.top    = (cur.cy - cur.ry) + 'px';
  el.style.width  = (cur.rx * 2) + 'px';
  el.style.height = (cur.ry * 2) + 'px';
}

function updateOverride(id, patch) {
  state.bubbleOverrides[id] = { ...(state.bubbleOverrides[id] || {}), ...patch };
  saveState();
}

function closeTemplateEditor() {
  document.querySelectorAll('.tpl-editor').forEach(e => e.remove());
  if (state.selectedTemplateId) {
    state.selectedTemplateId = null;
    renderPanels();
  }
}

function openTemplateEditor(id) {
  closeTemplateEditor();
  const tpl = BUBBLE_TEMPLATES.find(t => t.id === id);
  if (!tpl) return;
  state.selectedTemplateId = id;
  renderPanels();      // suppresses baked SVG text so overlay is WYSIWYG

  const cur = resolveTemplate(tpl);
  const spec = TYPE_STYLE[cur.type] || { fill: '#fff', ink: '#000' };
  const el = document.createElement('div');
  el.className = 'tpl-editor';
  el.tabIndex = 0;   // focusable so global keydown shortcuts have context
  positionEditor(el, cur);

  // No popup controls — style/font cycling handled by keyboard shortcuts:
  //   Shift+Tab  → next style (colour cycle)
  //   Arrow keys → next/prev font
  //   Delete     → remove
  //   drag on the editor's dashed border → move (see startTemplateDrag)

  // Textarea styled to match the SVG bubble underneath (WYSIWYG)
  const ta = document.createElement('textarea');
  ta.value = cur.text || '';
  const stg = stagePixelSize();
  const scale = stg.w / VIEW_W;      // stage-wrap CSS scale factor
  // Recompute the same font size the SVG drawer would pick
  const rx = cur.rx, ry = cur.ry;
  const isRect = !!TYPE_STYLE[cur.type];
  const padX = isRect ? rx * 0.08 : rx * 0.2;
  const padY = isRect ? ry * 0.14 : ry * 0.2;
  const areaW = (rx - padX) * 2;
  const areaH = (ry - padY) * 2;
  const raw = (cur.text || '').split('\n');
  const stripped = raw.map(s => s.replace(/\*/g, ''));
  const perLine = areaH / Math.max(1, raw.length);
  const longest = Math.max(3, ...stripped.map(l => l.length));
  let fontPx = Math.min(perLine * 0.82, areaW / (longest * 0.52));
  fontPx = Math.max(7, Math.min(fontPx, 36));

  ta.style.padding      = `${padY}px ${padX}px`;
  ta.style.fontSize     = fontPx + 'px';
  ta.style.fontFamily   = `"${cur.font || currentFont}", "Comic Neue", cursive`;
  ta.style.color        = spec.ink;
  ta.style.textAlign    = (cur.align || 'center') === 'left' ? 'left' : 'center';
  ta.style.fontStyle    = spec.alwaysItalic ? 'italic' : 'normal';
  ta.style.lineHeight   = '1.15';

  ta.addEventListener('input', () => {
    updateOverride(id, { text: ta.value });
    renderPanels();
  });
  ta.addEventListener('mousedown', e => e.stopPropagation());
  el.appendChild(ta);

  // Resize handles
  ['nw','ne','sw','se'].forEach(dir => {
    const h = document.createElement('div');
    h.className = 'tpl-handle ' + dir;
    h.addEventListener('mousedown', (e) => startTemplateResize(e, id, dir, el, tpl));
    el.appendChild(h);
  });

  // Mousedown on the editor's frame (not on textarea or a handle) = drag.
  el.addEventListener('mousedown', (e) => {
    if (e.target === ta) return;
    if (e.target.classList.contains('tpl-handle')) return;
    e.stopPropagation(); e.preventDefault();
    startTemplateDrag(e, id, el, tpl);
  });

  bubbleLayer.appendChild(el);
  // Focus the editor DIV (not the textarea) so keyboard shortcuts fire.
  // Clicking into the textarea puts focus there for typing.
  setTimeout(() => el.focus(), 0);
}

function startTemplateDrag(e, id, el, tpl) {
  const cur = resolveTemplate(tpl);
  const startX = e.clientX, startY = e.clientY;
  const origCx = cur.cx, origCy = cur.cy;
  function onMove(ev) {
    const stg = stagePixelSize();
    const dx = (ev.clientX - startX) * (VIEW_W / stg.w);
    const dy = (ev.clientY - startY) * (VIEW_H / stg.h);
    const cx = origCx + dx, cy = origCy + dy;
    updateOverride(id, { cx, cy });
    renderPanels();
    positionEditor(el, { cx, cy, rx: cur.rx, ry: cur.ry });
  }
  function onUp() {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

function startTemplateResize(e, id, dir, el, tpl) {
  e.stopPropagation();
  e.preventDefault();
  const cur = resolveTemplate(tpl);
  const startX = e.clientX, startY = e.clientY;
  const origCx = cur.cx, origCy = cur.cy;
  const origRx = cur.rx, origRy = cur.ry;
  function onMove(ev) {
    const stg = stagePixelSize();
    const dx = (ev.clientX - startX) * (VIEW_W / stg.w);
    const dy = (ev.clientY - startY) * (VIEW_H / stg.h);
    let rx = origRx, ry = origRy, cx = origCx, cy = origCy;
    if (dir.includes('e')) { rx = Math.max(20, origRx + dx / 2); cx = origCx + dx / 2; }
    if (dir.includes('w')) { rx = Math.max(20, origRx - dx / 2); cx = origCx + dx / 2; }
    if (dir.includes('s')) { ry = Math.max(10, origRy + dy / 2); cy = origCy + dy / 2; }
    if (dir.includes('n')) { ry = Math.max(10, origRy - dy / 2); cy = origCy + dy / 2; }
    updateOverride(id, { rx, ry, cx, cy });
    renderPanels();
    positionEditor(el, { cx, cy, rx, ry });
  }
  function onUp() {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

// Close editor when clicking anywhere outside the editor + its target bubble.
document.addEventListener('mousedown', (e) => {
  if (e.target.closest('.tpl-editor')) return;
  if (e.target.closest('.svg-bubble')) return;
  if (state.selectedTemplateId) closeTemplateEditor();
});

// =====================================================================
//  PDF EXPORT — tile the 45"-tall board into A4 or A3 pages
// =====================================================================

const PAGE_SIZES = {
  a4: { w: 8.27,  h: 11.69, name: 'A4' },
  a3: { w: 11.69, h: 16.54, name: 'A3' },
};

async function exportPDF(format) {
  const spec = PAGE_SIZES[format];
  if (!spec) return;
  if (!(window.jspdf && window.jspdf.jsPDF)) {
    showToast('PDF library not loaded'); return;
  }
  const { jsPDF } = window.jspdf;

  // Target: assembled comic must be EXACTLY 45" tall. Width follows the
  // stage aspect. Pages are cut to A4/A3 grid; edge pages are shorter/narrower
  // (each PDF page is the exact size of its comic slice — no whitespace
  // padding — so users can butt them together and land at 45" on the nose).
  const BOARD_H_IN  = 45;
  const boardAspect = VIEW_W / VIEW_H;
  const BOARD_W_IN  = BOARD_H_IN * boardAspect;
  const cols = Math.ceil(BOARD_W_IN / spec.w);
  const rows = Math.ceil(BOARD_H_IN / spec.h);
  const DPI  = 200;   // print-quality raster
  const fullW = Math.round(BOARD_W_IN * DPI);
  const fullH = Math.round(BOARD_H_IN * DPI);

  showToast(`Rendering ${cols}×${rows}=${cols*rows} ${spec.name}-sized tiles at ${BOARD_W_IN.toFixed(2)}″ × ${BOARD_H_IN}″…`);

  // Hide selection so it doesn't print.
  const prevSel = state.selectedPanelId;
  const prevTpl = state.selectedTemplateId;
  if (prevSel) deselectAll();
  if (prevTpl) closeTemplateEditor();
  await new Promise(r => setTimeout(r, 30));

  const svgStr  = new XMLSerializer().serializeToString(svg);
  const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const svgUrl  = URL.createObjectURL(svgBlob);
  const img = await new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = reject;
    im.src = svgUrl;
  });
  const boardCanvas = document.createElement('canvas');
  boardCanvas.width = fullW; boardCanvas.height = fullH;
  const bctx = boardCanvas.getContext('2d');
  bctx.fillStyle = '#fff';
  bctx.fillRect(0, 0, fullW, fullH);
  bctx.drawImage(img, 0, 0, fullW, fullH);
  URL.revokeObjectURL(svgUrl);

  const tileWpx = Math.round(spec.w * DPI);
  const tileHpx = Math.round(spec.h * DPI);
  let pdf = null;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const srcX = c * tileWpx, srcY = r * tileHpx;
      const cropWpx = Math.min(tileWpx, fullW - srcX);
      const cropHpx = Math.min(tileHpx, fullH - srcY);
      const pageWin = cropWpx / DPI;
      const pageHin = cropHpx / DPI;

      const tileCanvas = document.createElement('canvas');
      tileCanvas.width = cropWpx; tileCanvas.height = cropHpx;
      const tctx = tileCanvas.getContext('2d');
      tctx.fillStyle = '#fff';
      tctx.fillRect(0, 0, cropWpx, cropHpx);
      tctx.drawImage(boardCanvas, srcX, srcY, cropWpx, cropHpx, 0, 0, cropWpx, cropHpx);
      const dataURL = tileCanvas.toDataURL('image/png');

      const orient = pageWin > pageHin ? 'landscape' : 'portrait';
      if (!pdf) {
        pdf = new jsPDF({ unit: 'in', format: [pageWin, pageHin], orientation: orient });
      } else {
        pdf.addPage([pageWin, pageHin], orient);
      }
      pdf.addImage(dataURL, 'PNG', 0, 0, pageWin, pageHin);
    }
  }
  pdf.save(`roommate-billboard-${spec.name.toLowerCase()}.pdf`);
  if (prevSel) selectPanel(prevSel);
  showToast(`${spec.name} PDF saved — ${cols*rows} tiles → ${BOARD_W_IN.toFixed(2)}″ × ${BOARD_H_IN}″`);
}

// =====================================================================
//  INIT
// =====================================================================

document.fonts.ready.then(async () => {
  // Priority: project.json in repo → localStorage → defaults.
  const shipped = await tryFetchProjectJson();
  const saved = shipped || loadState();
  if (saved) {
    if (saved.v)  state.vertices = saved.v;
    if (saved.pi) state.panelImages = saved.pi;
    if (saved.bo) state.bubbleOverrides = saved.bo;
    if (saved.f)  currentFont = saved.f;
  }
  renderPanels();
  renderHandles();
  if (saved && saved.ub) {
    saved.ub.forEach(b => {
      if (b.type === 'image') {
        placeBubble({ type: 'image', src: b.src, x: b.x, y: b.y, w: b.w, h: b.h, focus: false });
      } else {
        placeBubble({ ...b, style: b.styleKey, focus: false });
      }
    });
  }
  fitStage();
  renderStyleChips();
  document.getElementById('export-a4').addEventListener('click', () => exportPDF('a4'));
  document.getElementById('export-a3').addEventListener('click', () => exportPDF('a3'));
  document.getElementById('reset-text').addEventListener('click', resetTextOnly);
  document.getElementById('save-project').addEventListener('click', downloadProject);
  const fileInput = document.getElementById('load-file');
  document.getElementById('load-project').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) loadProjectFromFile(e.target.files[0]);
  });
  if (shipped) showToast('Loaded project.json from repo');
});
</script>
