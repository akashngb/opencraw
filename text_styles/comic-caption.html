<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comic Caption</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e4d8;
      font-family: system-ui, sans-serif;
    }

    .comic-caption {
      background-color: #fdf23f;
      border: 4px solid #000000;
      padding: 12px 18px;
      font-family: 'Bangers', 'Comic Sans MS', sans-serif;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #000000;
      box-shadow: 6px 6px 0px #000000;
      max-width: 350px;
    }
  </style>
</head>
<body>
  <div class="comic-caption">
    MEANWHILE, ON THE OTHER SIDE OF TOWN...
  </div>
</body>
</html>
